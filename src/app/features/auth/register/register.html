<div class="auth-wrapper">
  <main class="auth-main">
    <div class="auth-card">
      
      <!-- Logo con Escudo Verde DENTRO del cuadro blanco -->
      <div class="card-brand">
        <div class="green-shield">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <span class="brand-text">
          <span class="brand-dark">Cyber</span><span class="brand-green">Academy</span>
        </span>
      </div>

      <!-- Pestañas DENTRO del cuadro blanco -->
      <div class="auth-tabs">
        <a routerLink="/auth/login" class="tab-item">Iniciar sesión</a>
        <a routerLink="/auth/register" class="tab-item active">Registrarse</a>
      </div>

      <div class="card-header">
        <h1 class="card-title">Crea tu cuenta de estudiante</h1>
        <p class="card-subtitle">Ingresa tus datos para comenzar tu entrenamiento seguro.</p>
      </div>

      @if (errorMessage()) {
        <div class="alert-error">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-row">
          <div class="form-group col">
            <label for="firstName">Nombres</label>
            <input
              id="firstName"
              type="text"
              formControlName="firstName"
              placeholder="Carlos"
              class="form-control"
            />
          </div>

          <div class="form-group col">
            <label for="lastName">Apellidos</label>
            <input
              id="lastName"
              type="text"
              formControlName="lastName"
              placeholder="Mendoza"
              class="form-control"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="correo@ejemplo.com"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Mínimo 8 caracteres"
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Repite Contraseña</label>
          <input
            id="confirmPassword"
            type="password"
            formControlName="confirmPassword"
            placeholder="Vuelve a escribir la contraseña"
            class="form-control"
          />
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading()" class="btn-submit">
          {{ isLoading() ? 'Registrando y enviando OTP...' : 'Registrarme' }}
        </button>
      </form>

      <div class="card-footer">
        <a routerLink="/auth/login" class="link-switch">
          ¿Ya tienes cuenta? Iniciar sesión
        </a>
      </div>

    </div>
  </main>
</div>
