<ca-auth-shell>

  <header class="head">
    <h2>Crea tu cuenta de estudiante</h2>
    <p>Te enviaremos un código a tu correo para activarla.</p>
  </header>

  @if (errorMessage()) {
    <div class="ca-alert ca-alert--threat" role="alert">{{ errorMessage() }}</div>
  }

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form" novalidate>
    <div class="row">
      <div class="ca-field">
        <label for="firstName">Nombres</label>
        <input id="firstName" class="ca-input" type="text" formControlName="firstName" autocomplete="given-name" />
      </div>
      <div class="ca-field">
        <label for="lastName">Apellidos</label>
        <input id="lastName" class="ca-input" type="text" formControlName="lastName" autocomplete="family-name" />
      </div>
    </div>

    <div class="ca-field">
      <label for="email">Correo</label>
      <input id="email" class="ca-input" type="email" formControlName="email"
             autocomplete="email" placeholder="correo@ejemplo.com" />
    </div>

    <div class="ca-field">
      <label for="password">Contraseña</label>
      <input id="password" class="ca-input" type="password" formControlName="password"
             autocomplete="new-password" aria-describedby="password-hint" />
      <span id="password-hint" class="ca-field-hint">Mínimo 8 caracteres.</span>
    </div>

    <div class="ca-field">
      <label for="confirmPassword">Repite la contraseña</label>
      <input id="confirmPassword" class="ca-input" type="password" formControlName="confirmPassword"
             autocomplete="new-password" />
    </div>

    <button type="submit" class="ca-btn ca-btn--primary ca-btn--block" [disabled]="registerForm.invalid || isLoading()">
      {{ isLoading() ? 'Enviando código…' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="switch">
    ¿Ya tienes cuenta? <a routerLink="/auth/login" class="ca-link">Inicia sesión</a>
  </p>
</ca-auth-shell>
